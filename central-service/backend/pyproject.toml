[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "central-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1,<4",
    "flask-sock>=0.7,<1",
    "redis>=5,<7",
    "gunicorn>=23,<30",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "boto3>=1.36,<2",
    "confluent-kafka>=2.6,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]
